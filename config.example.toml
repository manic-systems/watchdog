# Watchdog Analytics Configuration Example

[site]
# Domains to track. This is the only required setting.
domains = [ "example.com" ]

# Salt rotation for privacy-preserving unique visitor estimates.
# Options: "daily", "hourly". Omit or set to no value to disable uniques.
salt_rotation = "daily"

# Sampling rate from 0.0 to 1.0. 1.0 tracks all accepted traffic.
sampling = 1.0

# Optional allow-list of custom events. Leave empty to allow any event name up to
# limits.max_custom_events.
custom_events = [ "signup", "purchase", "download" ]

[site.collect]
acquisition = false    # UTM fields, click-id parameter names, and referrer source.
browser     = false
country     = false
device      = true
domain      = false    # Set true for multi-site metrics.
engagement  = true
os          = false
pageviews   = true
properties  = false    # Bounded custom event/pageview properties.
referrer    = "domain" # "off", "domain", or "url"
screen      = false
sessions    = true

[site.path]
collapse_numeric_segments = true
max_segments              = 5
normalize_trailing_slash  = true
strip_fragment            = true
strip_query               = true

[limits]
max_custom_events      = 100
max_dimension_values   = 1000
max_events_per_minute  = 10000
max_metrics_per_minute = 60
max_paths              = 10000
max_property_keys      = 50
max_property_values    = 500
max_sources            = 500

[limits.device_breakpoints]
mobile = 768
tablet = 1024

[security]
trusted_proxies = [ "127.0.0.1", "10.0.0.0/8" ]

[security.cors]
allowed_origins = [ "*" ]
enabled         = false

[security.metrics_auth]
enabled  = false
password = "changeme"
username = "admin"

[server]
ingestion_path = "/api/event"
listen_addr    = "127.0.0.1:8080"
metrics_path   = "/metrics"
state_path     = "/var/lib/watchdog/hll.state"
