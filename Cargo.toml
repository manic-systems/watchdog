[package]
name         = "watchdog"
description  = "Privacy-first web analytics with Prometheus metrics"
version      = "1.0.0"
edition      = "2024"
rust-version = "1.95.0"
license      = "EUPL-1.2"

[dependencies]
addr                       = "0.15.6"
anyhow                     = "1.0.104"
axum                       = { version = "0.8.9", default-features = false, features = [ "http1", "json", "tokio", "tracing" ] }
cardinality-estimator-safe = { version = "4.0.3", features = [ "with_serde" ] }
data-encoding              = "2.11.1"
figment                    = { version = "0.10.19", features = [ "env" ] }
hmac-sha256                = "1.1.14"
hyper                      = { version = "1.10.1", features = [ "http1", "server" ] }
hyper-util                 = { version = "0.1.20", features = [ "service", "tokio" ] }
ipnet                      = "2.12.2"
jiff                       = { version = "0.2.37", default-features = false, features = [ "std" ] }
parking_lot                = "0.12.5"
postcard                   = { version = "1.1.3", default-features = false, features = [ "use-std" ] }
pound                      = "0.1.8"
prometheus                 = { version = "0.14.0", default-features = false, features = [ "process" ] }
rand                       = "0.10.2"
serde                      = { version = "1.0.229", features = [ "derive" ] }
subtle                     = "2.6.1"
thiserror                  = "2.0.20"
tokio                      = { version = "1.53.1", features = [ "fs", "macros", "net", "rt-multi-thread", "signal", "time" ] }
tokio-io-timeout           = "1.2.1"
tokio-util                 = { version = "0.7.19", features = [ "rt" ] }
toml                       = { version = "1.1.6", default-features = false, features = [ "parse", "serde", "std" ] }
tower-http                 = { version = "0.7.1", features = [ "cors", "timeout", "trace" ] }
tracing                    = { version = "0.1.44", default-features = false, features = [ "std" ] }
tracing-subscriber         = { version = "0.3.23", features = [ "env-filter" ] }
url                        = "2.5.8"

[dev-dependencies]
serde_json = "1.0.151"
tempfile   = "3.27.0"

[profile.release]
codegen-units = 4
lto           = "thin"
strip         = "symbols"
