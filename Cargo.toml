[package]
name         = "watchdog"
description  = "Privacy-first web analytics with Prometheus metrics"
version      = "2.0.0"
edition      = "2024"
rust-version = "1.95.0"
license      = "EUPL-1.2"

[dependencies]
addr                      = "0.15.6"
anyhow                    = "1.0.102"
axum                      = { version = "0.8.9", features = [ "macros" ] }
base64                    = "0.22.1"
clap                      = { version = "4.5.53", features = [ "derive" ] }
figment                   = { version = "0.10.19", features = [ "env", "toml" ] }
governor                  = "0.10.4"
hex                       = "0.4.3"
ipnet                     = "2.12.0"
mime_guess                = "2.0.5"
parking_lot               = "0.12.5"
postcard                  = { version = "1.1.3", features = [ "use-std" ] }
probabilistic-collections = { version = "0.7.0", features = [ "serde" ] }
prometheus                = { version = "0.14.0", features = [ "process" ] }
rand                      = "0.10.1"
rust-embed                = "8.11.0"
serde                     = { version = "1.0.228", features = [ "derive" ] }
sha2                      = "0.11.0"
subtle                    = "2.6.1"
thiserror                 = "2.0.18"
time                      = "0.3.47"
tokio                     = { version = "1.52.3", features = [ "fs", "macros", "net", "rt-multi-thread", "signal", "time" ] }
tokio-util                = { version = "0.7.18", features = [ "rt" ] }
toml                      = "1.1.2"
tower-http                = { version = "0.6.11", features = [ "cors", "trace" ] }
tracing                   = "0.1.44"
tracing-subscriber        = { version = "0.3.23", features = [ "env-filter" ] }
url                       = "2.5.8"
uuid                      = { version = "1.23.2", features = [ "v4" ] }

[dev-dependencies]
serde_json = "1.0.150"
tempfile   = "3.27.0"
