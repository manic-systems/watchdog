[package]
name         = "watchdog"
description  = "Privacy-first web analytics with Prometheus metrics"
version      = "1.0.0"
edition      = "2024"
rust-version = "1.95.0"
license      = "EUPL-1.2"

[dependencies]
addr                      = "0.15.6"
anyhow                    = "1.0.104"
axum                      = { version = "0.8.9", features = [ "macros" ] }
base64                    = "0.23.1"
cardinality-estimator-safe = { version = "4.0.3", features = [ "with_serde" ] }
clap                      = { version = "4.6.7", features = [ "derive" ] }
figment                   = { version = "0.10.19", features = [ "env", "toml" ] }
hex                       = "0.4.3"
ipnet                     = "2.12.2"
mime_guess                = "2.0.5"
parking_lot               = "0.12.5"
postcard                  = { version = "1.1.3", features = [ "use-std" ] }
prometheus                = { version = "0.14.0", features = [ "process" ] }
rand                      = "0.10.2"
rust-embed                = "8.12.0"
serde                     = { version = "1.0.229", features = [ "derive" ] }
sha2                      = "0.11.0"
subtle                    = "2.6.1"
thiserror                 = "2.0.20"
time                      = "0.3.55"
tokio                     = { version = "1.53.1", features = [ "fs", "macros", "net", "rt-multi-thread", "signal", "time" ] }
tokio-util                = { version = "0.7.19", features = [ "rt" ] }
toml                      = "1.1.6"
tower-http                = { version = "0.7.1", features = [ "cors", "trace" ] }
tracing                   = "0.1.44"
tracing-subscriber        = { version = "0.3.23", features = [ "env-filter" ] }
url                       = "2.5.8"
uuid                      = { version = "1.26.1", features = [ "v4" ] }

[dev-dependencies]
serde_json = "1.0.151"
tempfile   = "3.27.0"
